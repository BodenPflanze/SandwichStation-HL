        priority: 2
        whitelist:
          tags:
            - Magazine9x19mmPistolFMJ
            - Magazine9x19mmPistolHighCapacityFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge9x19mmFMJ
        priority: 1
        whitelist:
          tags:
            - Cartridge9x19mmFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  # - type: StaticPrice # Frontier: use default value
  #   price: 500
  - type: NFWeaponDetails # Sandwich-HL
    manufacturer: weapon-details-manufacturer-nanotrasen-munitions # Sandwich-HL
