  - type: Gun
    # Sandwich-HL start
    minAngle: 7
    maxAngle: 21
    angleIncrease: 1.2
    angleDecay: 0.5
    customCaliber: "9x19mm"
    # Sandwich-HL end
    fireRate: 5
    availableModes:
