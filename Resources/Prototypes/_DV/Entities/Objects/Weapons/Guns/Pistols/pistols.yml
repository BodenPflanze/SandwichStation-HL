- type: entity
  name: mk 32
  parent: [BaseWeaponPistol, BaseC2ExpeditionContraband]
  id: WeaponPistolMk32
  description: The Mark 32 Handgun, produced by NanoTrasen's Small Arms Division. Uses 9x19mm ammo.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Pistols/mk32.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: Objects/Weapons/Guns/Pistols/mk32.rsi
  - type: Gun
    # Sandwich-HL start
    minAngle: 1
    maxAngle: 15
    angleIncrease: 3
    angleDecay: 7
    customCaliber: "9x19mm"
    # Sandwich-HL end
    fireRate: 4 # Frontier: 3<4
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mk58.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine9x19mmPistolFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/pistol_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/pistol_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine9x19mmPistolFMJ
            - Magazine9x19mmPistolHighCapacityFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge9x19mmFMJ
        priority: 1
        whitelist:
          tags:
            - Cartridge9x19mmFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: NFWeaponDetails # Sandwich-HL
    manufacturer: weapon-details-manufacturer-nanotrasen-munitions # Sandwich-HL

- type: entity
