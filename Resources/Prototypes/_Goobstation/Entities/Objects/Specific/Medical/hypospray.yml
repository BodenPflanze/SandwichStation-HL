# Cartridge Autoinjectors

- type: entity
  parent: BaseItem
  id: BaseCartridgeAutoinjector
  abstract: true
  components:
  - type: Item
    sprite: _Goobstation/Objects/Specific/Medical/autoinjector.rsi
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Medical/autoinjector.rsi
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: cartridge
  - type: Appearance
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 10
  - type: ExaminableSolution
    solution: hypospray
  - type: Hypospray
    solutionName: hypospray
    transferAmount: 10
    onlyAffectsMobs: false
    injectOnly: true
  - type: HyposprayBlockNonMobInjection
  - type: UseDelay
    delay: 30
  - type: ContainerContainer
    containers:
      item: !type:ContainerSlot
  - type: ItemSlots
    slots:
      item:
        name: Cartridge
        whitelist:
          tags:
          - AutoinjectorCartridge

- type: entity
  name: medical cartridge autoinjector
  parent: [ BaseCartridgeAutoinjector , BaseMedicalContraband ]
  description: Used for rapid administration of medicine. Uses cartridges printable at the medical techfab.
  id: ParamedHypo
  components:
  - type: Sprite
    layers:
      - state: medical-base
      - state: cartridge1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false

- type: entity # This ones weird.
  name: amnestic spray
  parent: [BaseItem, BaseCentcommContraband]
  id: AmnestizineHypospray
  suffix: DO NOT MAP
  description: A specialized cartridge injector intended for Central Command personnel. Primarily used to inject amnestics.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Medical/amnestic_hypo.rsi
    state: icon
  - type: Item
    sprite: _Goobstation/Objects/Specific/Medical/amnestic_hypo.rsi
  - type: UseDelay
    delay: 3
  - type: Appearance
  - type: SolutionContainerManager
    solutions:
      hypospray:
        maxVol: 10
  - type: ExaminableSolution
    solution: hypospray
  - type: Hypospray
    solutionName: hypospray
    transferAmount: 10
    onlyAffectsMobs: false
    injectOnly: true
  - type: HyposprayBlockNonMobInjection
  - type: ContainerContainer
    containers:
      item: !type:ContainerSlot
  - type: ItemSlots
    slots:
      item:
        name: Cartridge
        whitelist:
          tags:
          - AutoinjectorCartridge

# Autoinjector Cartridges

- type: entity
  name: autoinjector cartridge
  parent: BaseItem
  description: Used in a cartridge autoinjector.
  id: BaseAutoinjectorCartridge
  abstract: true
  components:
  - type: Item
    size: Tiny
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Medical/cartridge.rsi
    layers:
    - state: base
    - state: filling
      color: "#ffffff"
  - type: SolutionCartridge
    targetSolution: hypospray
    solution:
      maxVol: 10
  - type: Tag
    tags:
      - AutoinjectorCartridge
      - SecBeltEquip

#what were they cooking here before, 114 total possible dmg heal was crazyyy
#~21 dmg healed/dmg type (unless its cold, then its a lil more), doesnt heal caustic all that well
- type: entity
  name: emergency autoinjector cartridge
  parent: [ BaseSecurityMedicalContraband , BaseAutoinjectorCartridge ]
  description: Contains 10u of Omnizine, used in a cartridge autoinjector. # Contains 10u of atropine, used in a cartridge autoinjector.         # Cannot port any goob chems with this old wizden stuff. Fix this at some point when we are more upstream
  id: CartridgeAtropine
  components:
  - type: Sprite
    layers:
    - state: base
    - state: filling
      color: "#572757"
  - type: SolutionCartridge
    targetSolution: hypospray
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Omnizine # Atropine         # Cannot port any goob chems with this old wizden stuff. Fix this at some point when we are more upstream
        Quantity: 10

# Q - Why is this edible?
# A - Because the dispenser reminded me of a pez dispenser, and it'd be funny if you could eat them.
- type: entity
  name: amnestic autoinjector cartridge
  parent: [ BaseCentcommContraband , BaseAutoinjectorCartridge, EdibleBase ]
  description: Contains 10u of dimtremethic-neuramincyl acid, used in a cartridge autoinjector.
  id: CartridgeAmnestic
  components:
  - type: Sprite
    layers:
    - state: base
    - state: filling
      color: "#FAF9F6"
  - type: SolutionCartridge
    targetSolution: hypospray
    solution:
      maxVol: 10
      reagents:
      - ReagentId: Amnestizine
        Quantity: 10
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 10
        reagents:
        - ReagentId: Amnestizine
          Quantity: 10
  - type: Food
    delay: 0.2
    forceFeedDelay: 1.5
    transferAmount: null
    eatMessage: edible-swallow
    useSound: /Audio/Items/pill.ogg
  - type: BadFood
  - type: FlavorProfile
    ignoreReagents: [ ]

- type: entity
  name: centcomm advanced stimulant
  parent: [ChemicalMedipen, BaseCentcomContraband]
  id: CentcommStimpack
  suffix: DO NOT MAP
  description: According to a Nanotrasen funded study, it has zero addictive properties.
  components:
  - type: Sprite
    sprite: _Goobstation/Objects/Specific/Medical/medipen.rsi
    layers:
    - state: ntstimpen
      map: ["enum.SolutionContainerLayers.Fill"]
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 50
        reagents:
        - ReagentId: Stimulants
          Quantity: 25
        - ReagentId: Ichor
          Quantity: 10
        - ReagentId: Dylovene
          Quantity: 15
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    changeColor: false
    emptySpriteName: ntstimpen_empty
  - type: Hypospray
    solutionName: pen
    transferAmount: 50
    onlyAffectsMobs: false
    injectOnly: true
  - type: StaticPrice
    price: 500

