- type: entity # literally BaseWeaponPowerCell cuz we can't get rid of components in children HELL YEA
  id: BaseWeaponCustomCell
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
  - type: Item
    size: Huge
  - type: AmmoCounter
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: MagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: PowerCellSmall
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
            - PowerCell
            - PowerCellSmall
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: Cautery # Shitmed
    speed: 0.9
  - type: SurgeryTool # Shitmed
    endSound:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: AlwaysHot # Goobstation V
  - type: MeleeWeapon
    damage:
      types:
       Blunt: 12
    angle: 0
    wideAnimationRotation: 90 # -90 if it takes bayonets (hits with muzzle) 90 if not (hits with butt)
    soundHit:
      collection: MetalThud # Goobstation ^
  - type: RestrictGunshotsByUserTag # Goobstation
    doesntContain:
    - Oni
    messages:
    - oni-cannot-shoot-guns-1
    - oni-cannot-shoot-guns-2
    - oni-cannot-shoot-guns-3
  - type: BatteryDrinkerSource # Goobstation - Energycrit
    maxAmount: 180
  # - type: Multishot # Goobstation V                          # We dont have this
  #   missChance: 0.4
  #   spreadMultiplier: 3
  #   spreadAddition: 50 #very hard to hold two of these steady let alone steady while shooting them

- type: entity
  id: BaseWeaponCustomCellSmall
  parent: BaseWeaponCustomCell
  abstract: true
  components:
  - type: Item
    size: Small
    shape: # Goobstation
    - 0,0,1,0
    - 0,1,0,1
  - type: Tag
    tags:
    - Sidearm
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/taser.rsi
    quickEquip: false
    slots:
    - Belt
  - type: MeleeWeapon # Goobstation V
    damage:
      types:
       Blunt: 8 # pistol whip
    angle: 0
    wideAnimationRotation: 90 # -90 if it takes bayonets (hits with muzzle) 90 if not (hits with butt)
    soundHit:
      collection: MetalThud # Goobstation ^

- type: entity
  name: EG-4 energy revolver
  parent: [BaseWeaponCustomCellSmall, BaseC2ContrabandUnredeemable] # Sandwich- C2 Contra
  id: WeaponEnergyRevolver
  description: In the face of death, everyone is equal. The right arm of the Blueshield corps, the Equalizer is a modular energy revolver platform designed for lethal and non-lethal target neutralization. Takes energy speedloaders.
  components:
  - type: Item
    heldPrefix: lethal
  - type: Sprite
    sprite: _Goobstation/Objects/Weapons/Guns/Battery/erevolver.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-0
      map: ["enum.GunVisualLayers.Mag"] # Sandwich-HL
      shader: unshaded # Sandwich-HL
  - type: MagazineVisuals
    magState: mag-unshaded
    steps: 6
    zeroVisible: true
  - type: ItemMapper
    sprite: _Goobstation/Objects/Weapons/Guns/Battery/erevolver.rsi
    mapLayers:
      mode-disabler:
        whitelist:
          tags:
          - EnergySpeedloaderDisabler
  - type: Clothing
    quickEquip: false
    slots:
    - Belt
    - suitStorage
    - Back
    sprite: _Goobstation/Objects/Weapons/Guns/Battery/erevolver.rsi
  - type: Gun
    customCaliber: "Energy Speedloaders" # Sandwich-HL
    fireRate: 1.5
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
    soundEmpty:
      path: /Audio/_DV/Weapons/Guns/Empty/dry_fire.ogg
  - type: RestrictGunshotsByUserTag # Goobstation
    doesntContain:
    - Oni
    messages:
    - oni-cannot-shoot-guns-1
    - oni-cannot-shoot-guns-2
    - oni-cannot-shoot-guns-3
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: EnergySpeedloaderLethal
        insertSound: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
        whitelist:
          tags:
            - EnergySpeedloader
  - type: Tag
    tags:
    - Sidearm
  - type: PirateBountyItem # Mono
    id: TSFLaserWeapon
  - type: NFWeaponDetails # Sandwich-HL
    manufacturer: weapon-details-manufacturer-nanotrasen-munitions # Sandwich-HL

- type: entity
  name: advanced pulse carbine
  parent: WeaponPulseCarbine
  id: WeaponPulseCarbineAdvanced
  description: A state-of-the-art laser carbine that fires a rapidly pulsing beam. Expensive, though favoured by the Emergency Response corps due to its ability to self-recharge.
  components:
  - type: Tag
    tags:
    - Rifle
  - type: BatterySelfRecharger
    autoRecharge: true
    autoRechargeRate: 80