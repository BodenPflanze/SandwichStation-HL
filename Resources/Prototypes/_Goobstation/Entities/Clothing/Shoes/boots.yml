- type: entity
  parent: ClothingShoesBootsMag
  id: ClothingShoesBootsChrono
  name: futuristic boots
  description: An advanced futuristic shoe that guarantees wearer comfort and full traction on any surface
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Shoes/Boots/chronolegioneer.rsi
    state: icon
  - type: Clothing
    sprite: _Goobstation/Clothing/Shoes/Boots/chronolegioneer.rsi
  - type: Magboots
  - type: ClothingSpeedModifier
    walkModifier: 1
    sprintModifier: 1
  - type: NoSlip
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHeavySuit

- type: entity
  parent: ClothingShoesBootsChrono
  id: ClothingShoesBootsChronoUnremoveable
  suffix: Unremoveable
  components:
  - type: Unremoveable

- type: entity
  parent: ClothingShoesBaseButcherable
  id: ClothingShoesResonant
  name: resonant shoes
  description: Is it not time yet… for the splendid curtain to rise?
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Shoes/Boots/breverb.rsi
    state: icon
  - type: Clothing
    sprite: _Goobstation/Clothing/Shoes/Boots/breverb.rsi

- type: entity
  parent: [BaseCentcomContraband, ClothingShoesBootsMagAdv, BaseJetpack]
  id: ClothingShoesBootsMagEmergencyResponseTeam
  name: tactical response magboots
  description: Look! An emergency responder, we're saved!
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Shoes/Boots/emergencyresponseteam.rsi
    state: icon
  - type: Clothing
    sprite: _Goobstation/Clothing/Shoes/Boots/emergencyresponseteam.rsi
  - type: Item
    sprite: _Goobstation/Clothing/Shoes/Boots/emergencyresponseteam.rsi
  - type: Magboots
  - type: NoSlip
  - type: Tag
    tags:
    - WhitelistChameleon
  - type: ClothingSlowOnDamageModifier
    modifier: 0.5
  # - type: ModifyStandingUpTime    # We don't have that
  #   multiplier: 0.5               # (God bless if anyone ever adds this because from looking at it, we need to switch the current Proning system with the one from goob which also does some changes to the StaminaSystem)
  - type: GasTank
    outputPressure: 42.6
    air:
      # 2 minutes of thrust
      volume: 2
      temperature: 293.15
      moles:
      - 0.153853429 # oxygen
      - 0.153853429 # nitrogen

- type: entity
  parent: ClothingShoesBootsMagEmergencyResponseTeam
  id: ClothingShoesBootsMagDeathsquad
  name: deathsquad magboots
  description: The sound of these boots are iconic; the sound of terror.
  components:
  - type: Sprite
    sprite: _Goobstation/Clothing/Shoes/Boots/deathsquad.rsi
    state: icon
  - type: Clothing
    sprite: _Goobstation/Clothing/Shoes/Boots/deathsquad.rsi
  - type: Item
    sprite: _Goobstation/Clothing/Shoes/Boots/deathsquad.rsi
  - type: ClothingSpeedModifier
    walkModifier: 1.10
    sprintModifier: 1.10
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepHeavySuit
  - type: GasTank
    outputPressure: 42.6
    air:
      # 2 minutes of thrust
      volume: 2
      temperature: 293.15
      moles:
      - 0.153853429 # oxygen
      - 0.153853429 # nitrogen
  - type: Tag
    tags: [] # ignore "WhitelistChameleon" tag

