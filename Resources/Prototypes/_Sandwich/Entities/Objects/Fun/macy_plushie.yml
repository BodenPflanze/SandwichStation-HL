- type: entity
  parent: BasePlushie
  id: PlushieMacy
  name: Macy Plushie
  description: Smells like medicine.
  components:
  - type: Sprite
    sprite: _Sandwich/Objects/Fun/macy_cross.rsi
    state: icon
    scale: 0.6, 0.6
  - type: EmitSoundOnUse
    sound:
      path: /Audio/Animals/cat_meow.ogg
  - type: EmitSoundOnActivate
    sound:
      path: /Audio/Animals/cat_meow2.ogg
  - type: EmitSoundOnTrigger
    sound:
      path: /Audio/Animals/cat_meow.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Animals/cat_hiss.ogg
  - type: UseDelay
    delay: .5
