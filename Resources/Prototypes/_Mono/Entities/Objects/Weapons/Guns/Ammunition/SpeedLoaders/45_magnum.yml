- type: entity
  id: BaseSpeedLoader45_magnum
  name: "speed loader (.45 magnum)"
  parent: [ BaseItem, BaseC1Contraband ] # Frontier: BaseSecurityContraband<BaseC1Contraband
  abstract: true
  components:
  - type: Tag
    tags:
      - SpeedLoader45_magnumFMJ
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
        - Cartridge45_magnumFMJ
    capacity: 6
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
  # Sandwich-HL start: makin speedloader visual better :P
  - type: Appearance
  - type: DynamicSpeedloaderVisuals
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/SpeedLoaders/45_magnum/45_magnum_speed_loader.rsi
    layers:
      - state: base
        map: [ "enum.SpeedLoaderVisualLayers.Base" ]
      - map: [ "enum.SpeedLoaderVisualLayers.Chamber1" ]
      - map: [ "enum.SpeedLoaderVisualLayers.Chamber2" ]
      - map: [ "enum.SpeedLoaderVisualLayers.Chamber3" ]
      - map: [ "enum.SpeedLoaderVisualLayers.Chamber4" ]
      - map: [ "enum.SpeedLoaderVisualLayers.Chamber5" ]
      - map: [ "enum.SpeedLoaderVisualLayers.Chamber6" ]
  # Sandwich-HL end

- type: entity
  id: SpeedLoader45_magnumFMJ
  name: "speed loader (.45 magnum FMJ)"
  parent: BaseSpeedLoader45_magnum
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge45_magnumFMJ

