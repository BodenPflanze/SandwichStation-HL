# 90mm Base

- type: entity
  id: 90mmBulletBase
  name: shell
  parent: BaseBulletTrigger
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 3
  - type: PointLight
    radius: 3.5
    energy: 0.5
  - type: ShipWeaponProjectile
  - type: RadarBlip
    scale: 1
    requireNoGrid: true
    shape: triangle
    visibleFromOtherGrids: true

- type: entity # Sandwich-HL: moved base up here
  id: 90mmBulletExplosiveBase
  parent: 90mmBulletBase
  abstract: true
  categories: [ HideSpawnMenu ]
  components:
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default

- type: entity
  id: 90mmBulletArmorPiercing
  name: 90mm APHE shell
  parent: 90mmBulletExplosiveBase
  categories: [ HideSpawnMenu ]
  components:
  - type: TriggerOnCollide # Sandwich-HL (its a APHE shell)
    fixtureID: projectile # Sandwich-HL
    delay: 0.02 # Sandwich-HL
  - type: Projectile
    damage:
      types:
        Structural: 875
        Blunt: 180 # Sandwich-HL
        Piercing: 360 # Sandwich-HL
    penetrationThreshold: 900 # Sandwich-HL
    penetrationDamageTypeRequirement: # Sandwich-HL
      - Structural # Sandwich-HL
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/630_armorpiercing_shell_casing.rsi
    layers:
    - state: base-projectile
  - type: Explosive
    totalIntensity: 30
    intensitySlope: 2
    maxIntensity: 4
    maxTileBreak: 0
  - type: PointLight
    color: orange

# 90mm Shells

- type: entity
  id: 90mmShellBase
  abstract: true
  parent: BaseItem
  components:
  - type: Tag
    tags:
    - CartridgeShell
    - Cartridge
  - type: Item
    size: Normal
  - type: CartridgeAmmo
    deleteOnSpawn: true
    muzzleFlash: null
  - type: Sprite
    layers:
    - state: base
      map: [ "enum.AmmoVisualLayers.Base" ]
  - type: Appearance
  - type: SpentAmmoVisuals
  - type: SpaceGarbage

- type: entity
  id: 90mmShellArmorPiercing
  name: 90mm depleted uranium shell
  parent: 90mmShellBase
  description: An artillery shell with a depleted uranium tip.
  components:
  - type: CartridgeAmmo
    proto: 90mmBulletArmorPiercing
  - type: Sprite
    sprite: _Mono/Objects/SpaceArtillery/630_armorpiercing_shell_casing.rsi