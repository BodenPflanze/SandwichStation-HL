# GUIDE:
# T1 - 7500 HP - 30 SEC COOLDOWN 
# T2 - 15000 HP - 60 SEC COOLDOWN
# T3 - 30000 HP - 120 SEC COOLDOWN
# TODO: DSM-SPECIFIC T0 SHIELD WITH 3500 HP AND 20 SECOND COOLDOWN
# TODO: SIDEGRADE T1 / T2 SHIELDS WITH LOWER HP BUT 10 SECOND COOLDOWN
# VULCAN - WEAKNESS, 150 DMG / PROJECTILE, 12 PROJECTILES / SECOND, 1800 DPS - TAKES 10, 20, 40 SECONDS TO DOWN A SHIELD
# SLUGTHROWER - DU PIERCES SHIELD, HE DEALS 150DMG / HIT
# SWARMER/LANCER - 1000 DAMAGE / MISSILE
# 48MM - IGNORES SHIELD
# 120MM - DU DEALS 1000 DMG / HIT, HE DEALS 150 DAMAGE / HIT
# 320MM - DEALS 5000 TO SHIELD

# Base
- type: entity
  id: ShieldGeneratorBase
  parent: [ BaseMachinePowered, ConstructibleMachine ] #HL
  name: Shield Generator
  abstract: true
  components:
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -5
    range: 30
    enabled: false
    sound:
      path: /Audio/Ambience/Objects/anomaly_generator.ogg
  - type: Sprite
    sprite: _Mono/Structures/ShuttleComponents/shield.rsi
    snapCardinals: true
    layers:
    - state: control
    - state: control_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      visible: false
      color: "#FF3333"
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
    snapCardinals: true
  - type: Physics
    bodyType: Static
  - type: Transform
    noRot: true
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 1500
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
      - !type:SpawnGasBehavior
        gasMixture:
          volume: 1000
          moles:
          - 194 # oxygen
          - 0 # nitrogen
          - 0 # carbon dioxide
          - 6 # plasma
          temperature: 752.48
    - trigger:
        !type:DamageTrigger
        damage: 1000
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Explosive
    explosionType: Default
    maxIntensity: 4000
    intensitySlope: 4
    totalIntensity: 600
  - type: Repairable
    doAfterDelay: 8
  - type: PointLight
    enabled: false
    castShadows: true
    radius: 2
    energy: 1.5
    color: "#FF3333"
  - type: AnimationPlayer
  - type: LitOnPowered
  - type: PowerSwitch
  - type: ApcPowerReceiver
    powerLoad: 60000
  - type: Appearance
  - type: ShipShieldEmitter
    damageLimit: 65000
    healPerSecond: 1750 # Base is 250
    damageExp: 1.15 # Base is 1.1
    powerDraw: 40000 # Base is 50000
    unpoweredBonus: 7 # Base is 6
    damageOverloadTimePunishment: 40
    shieldColor: "#FF3333"
    powerUpSound: !type:SoundPathSpecifier
        path: "/Audio/Effects/teleport_arrival.ogg"
        params:
          pitch: 0.5
    powerDownSound: !type:SoundPathSpecifier
        path: "/Audio/Effects/teleport_departure.ogg"
        params:
          pitch: 0.5
 # - type: Machine
    # board removed: machine board prototype not available
  - type: Construction
    graph: Machine
    node: machine
    # machine board/parts containers removed due to missing machine board prototypes
  #- type: ContainerContainer
    # containers removed due to missing machine board prototypes
  - type: PirateBountyItem
    id: ShipShield

