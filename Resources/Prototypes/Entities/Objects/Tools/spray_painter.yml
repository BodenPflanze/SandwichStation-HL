- type: entity
  parent: [BaseItem, RecyclableItemDeviceSmall] # Frontier: added RecyclableItemDeviceSmall
  id: SprayPainter
  name: spray painter
  description: A spray painter for painting airlocks, pipes, and other items.
  components:
  - type: Sprite
    sprite: Objects/Tools/spray_painter.rsi
    state: spray_painter
  - type: Item
    sprite: Objects/Tools/spray_painter.rsi
  - type: ActivatableUI
    key: enum.SprayPainterUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SprayPainterUiKey.Key:
        type: SprayPainterBoundUserInterface
  - type: SprayPainter
    colorPalette:
      red: '#FF1212FF'
      yellow: '#B3A234FF'
      brown: '#947507FF'
      green: '#3AB334FF'
      cyan: '#03FCD3FF'
      blue: '#0335FCFF'
      white: '#FFFFFFFF'
      black: '#333333FF'
      # standard atmos pipes
      waste: '#990000'
      distro: '#0055cc'
      air: '#03fcd3'
      mix: '#947507'
      external: '#9955cc' # Frontier
      oxygen: '#7fbfff' # Sandwich-HL | color of oxygen not included gas
      nitrogen: '#cc5249' # Sandwich-HL | color of n2 tanks
      carbon dioxide: '#404040'
      water vapor: '#e8feff' # Sandwich-HL | color of oxygen not included gas
      plasma: '#d30eb0' # Sandwich-HL | color of plasma sheets
      tritium: '#13FF4B' # Sandwich-HL | color from our old fork
      ammonia: '#baa241' # Sandwich-HL | color of oxygen not included gas (another purple for actual ss14 gas colour would not help)
      nitrous oxide: '#ffbfba' # Sandwich-HL | color of n2o tank 
      frezon: '#8fe9ff' # Sandwich-HL | Freezon color without looking too much like oxygen pipe
      hot loop: '#ff3300' # Sandwich-HL | Not the red color
      cold loop: '#0077ff' # Sandwich-HL | Not distro or blue color
      burn chamber: '#FF9900'
  - type: StaticPrice
    price: 20 # Frontier 40<20
  - type: LimitedCharges
    maxCharges: 50
    lastCharges: 50
  - type: PhysicalComposition
    materialComposition:
      Steel: 100

- type: entity
  parent: SprayPainter
  id: SprayPainterRecharging
  suffix: Admeme
  components:
  - type: AutoRecharge
    rechargeDuration: 1

- type: entity
  parent: SprayPainter
  id: SprayPainterEmpty
  suffix: Empty
  components:
  - type: LimitedCharges
    lastCharges: -1

- type: entity
  parent: BaseItem
  id: SprayPainterAmmo
  name: compressed paint
  description: A cartridge of highly compressed paint, commonly used in spray painters.
  components:
  - type: SprayPainterAmmo
  - type: Sprite
    sprite: Objects/Tools/spray_painter.rsi
    state: ammo
  - type: Item
    sprite: Objects/Tools/spray_painter.rsi
    heldPrefix: ammo
  - type: PhysicalComposition
    materialComposition:
      Steel: 30
      Plastic: 30
  - type: StaticPrice
    price: 30
