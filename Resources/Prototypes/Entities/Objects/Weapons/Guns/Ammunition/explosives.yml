- type: entity
  id: GrenadeBaton
  name: 40mm baton grenade
  parent: BaseGrenade
  components:
  - type: CartridgeAmmo
    proto: Bullet40mmGrenadeBaton # Frontier
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: baton
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: baton
    suffix: false

- type: entity
  id: GrenadeBlast
  name: blast grenade
  parent: BaseGrenade
  categories: [ HideSpawnMenu ] # Sandwich-HL: we use _Mono
  components:
  - type: CartridgeAmmo
    proto: Bullet40mmGrenadeThermobaric # Frontier
    deleteOnSpawn: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: blast
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: blast
    suffix: false

- type: entity
  id: GrenadeFlash
  name: 40mm flash grenade
  parent: BaseGrenade
  components:
  - type: CartridgeAmmo
    proto: Bullet40mmGrenadeFlash
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: flash
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: flash
    suffix: false

- type: entity
  id: GrenadeFrag
  name: 40mm Fragmentation grenade
  parent: BaseGrenade
  components:
  - type: CartridgeAmmo
    proto: Bullet40mmGrenadeFragmentation
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: frag
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: frag
    suffix: false

- type: entity
  parent: BaseGrenade
  id: GrenadeCleanade
  name: 40mm cleanade
  components:
  - type: CartridgeAmmo
    proto: BulletGrenadeCleanade
    deleteOnSpawn: true # Caseless cuz Hydra kinda bulky with wield + revolver
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: cleanade
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: frag
    suffix: false
  - type: Tag # Sandwich-HL
    tags:
    - Bullet40mmFoamNade # Sandwich-HL
    - Grenade # Sandwich-HL

- type: entity
  id: GrenadeEMP
  name: 40mm EMP grenade
  parent: BaseGrenade
  components:
  - type: CartridgeAmmo
    proto: Bullet40mmGrenadeEMP
  - type: EmpDescription # Sandwich-HL
    range: 5 # Sandwich-HL
    energyConsumption: 2700000 # Sandwich-HL
    disableDuration: 10 # Sandwich-HL
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Explosives/explosives.rsi
    layers:
    - state: emp
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: frag
    suffix: false

