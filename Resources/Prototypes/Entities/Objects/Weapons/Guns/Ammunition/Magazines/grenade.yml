- type: entity
  id: BaseMagazineGrenade
  name: grenade cartridge
  parent: [ BaseCartridge, BaseC2ContrabandUnredeemable ] # Frontier: BaseSecurityContraband<BaseC2ContrabandUnredeemable
  abstract: true
  components:
  - type: Tag
    tags:
    - MagazineGrenade
    - Magazine40mm
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Grenade
    capacity: 5
    soundRack:
      path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
      params:
        variation: 0.05
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/rifle_load.ogg
      params:
        variation: 0.05
  - type: Item
    size: Large
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Grenade/grenade_cartridge.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-4
      map: ["enum.GunVisualLayers.Mag"]
    scale: 0.75, 0.75 # Sandwich-HL (Huge ass sprite)
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance

- type: entity
  id: MagazineGrenadeEmpty
  name: 40mm grenade cartridge Magazine
  parent: BaseMagazineGrenade
  components:
  - type: BallisticAmmoProvider

- type: entity
  id: MagazineGrenadeFrag
  name: 40mm Fragmentation grenade Magazine
  parent: BaseMagazineGrenade
  components:
  - type: BallisticAmmoProvider
    proto: GrenadeFrag # Frontier

- type: entity
  id: MagazineGrenadeEMP
  name: 40mm EMP grenade Magazine
  parent: BaseMagazineGrenade
  components:
  - type: BallisticAmmoProvider
    proto: GrenadeEMP # Frontier

- type: entity
  id: MagazineGrenadeFlash
  name: 40mm flash grenade Magazine
  parent: BaseMagazineGrenade
  components:
  - type: BallisticAmmoProvider
    proto: GrenadeFlash # Frontier

- type: entity
  id: MagazineGrenadeBlast
  name: 40mm cleanade Magazine
  parent: BaseMagazineGrenade
  components:
  - type: BallisticAmmoProvider
    proto: GrenadeBlast # Frontier

- type: entity
  id: MagazineGrenadeBaton
  name: 40mm baton grenade
  parent: BaseMagazineGrenade
  components:
  - type: BallisticAmmoProvider
    proto: GrenadeBaton # Frontier

