# A basic inheritable template for a gun that is wieldable and has the standard inaccuracy.
- type: entity
  id: BaseGunWieldable
  abstract: true
  components:
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -20
    maxAngle: -30
  - type: Gun
    minAngle: 21
    maxAngle: 32   

# Sandwich-HL: start
- type: entity
  id: BaseRequiersWieldable
  abstract: true
  components:
  - type: Wieldable
    unwieldOnUse: false
  - type: GunRequiresWield
  - type: GunWieldBonus
    minAngle: -0 # Set to 0 because GunRequiresWield
    maxAngle: -0
  - type: Gun
    minAngle: 1.5
    maxAngle: 3
    angleIncrease: 0.5
    angleDecay: 1
    fireRate: 2.25
  - type: SpeedModifiedOnWield
    walkModifier: 0.8
    sprintModifier: 0.8
# Sandwich-HL: end