- type: entity
  id: WeaponProtoKineticAcceleratorBase
  abstract: true
  parent: BaseItem
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
  - type: Item
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
    size: Large
    shape:
    - 0,0,2,1
  - type: GunWieldBonus
    minAngle: -30 # Sandwich-HL: -43 < -30
    maxAngle: -30 # Sandwich-HL: -43 < -30
  - type: Wieldable
  - type: Gun
    energyJouleRating: 1100 # Sandwich-HL
    energyProjectileType: gun-examine-joules-kineticbolt # Sandwich-HL
    fireRate: 0.5
    selectedMode: SemiAuto
    angleIncrease: 7
    angleDecay: 5 # Sandwich-HL: 45 < 5
    minAngle: 34.4 # Sandwich-HL: 44 < 34.4
    maxAngle: 43.2 # Sandwich-HL: 45 < 43.2
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/kinetic_accel.ogg
  - type: AmmoCounter
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        empty-icon:
          True: { visible: False }
          False: { visible: True }
        #todo: add other 'empty' animations
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 0.75
    rechargeSound:
      path: /Audio/Weapons/Guns/MagIn/kinetic_reload.ogg
  - type: BasicEntityAmmoProvider
    proto: NFBulletKinetic # Frontier: use NF prefix
    capacity: 1
    count: 1
  - type: Clothing
    sprite: Objects/Weapons/Guns/Basic/kinetic_accelerator.rsi
    quickEquip: false
    slots:
    - suitStorage
    - Belt
  - type: UseDelay
    delay: 1
