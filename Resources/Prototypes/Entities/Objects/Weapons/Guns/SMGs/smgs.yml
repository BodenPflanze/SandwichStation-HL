- type: entity
  name: BaseSMG
  parent: BaseItem
  id: BaseWeaponSubMachineGun
  description: A rooty tooty point and shooty.
  abstract: true
  components:
  - type: Sprite
  - type: Item
    size: Large
  - type: Clothing
    sprite: Objects/Weapons/Guns/SMGs/atreides.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: AmmoCounter
  # Sandwich-HL start
  - type: Wieldable
    unwieldOnUse: false
  - type: GunWieldBonus
    minAngle: -0.5
    maxAngle: -1.3
    angleIncrease: -1
  # Sandwich-HL end
  - type: Gun
    customCaliber: "9x19mm" # Sandwich-HL
    minAngle: 2
    maxAngle: 16
    fireRate: 8
    burstFireRate: 8
    angleIncrease: 3
    angleDecay: 16
    selectedMode: FullAuto
    availableModes:
    - SemiAuto
    - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/smg.ogg
    defaultDirection: 1, 0
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/smg_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine9x19mmSubMachineGunFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine9x19mmSubMachineGunFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge9x19mmFMJ
        priority: 1
        whitelist:
          tags:
            - Cartridge9x19mmFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: StaticPrice
    price: 500
  - type: NFWeaponDetails # Sandwich-HL
    class: weapon-details-class-submachine-gun # Sandwich-HL

# Sandwich-HL: start
- type: entity
  name: WornBaseSMG
  id: WornBaseSMG
  abstract: true
  components:
  - type: Gun
    minAngle: 3.4
    maxAngle: 17.2
    angleIncrease: 3.6
# Sandwich-HL: end


- type: entity
  name: Atreides
  parent: [BaseWeaponSubMachineGun, BaseC3SyndicateContraband] # Frontier: BaseMajorContraband<BaseC3SyndicateContraband
  id: WeaponSubMachineGunAtreides
  description: Pla-ket-ket-ket-ket! An illegal firearm often used by Syndicate agents.
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/SMGs/atreides.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Gun
    customCaliber: "5.7x28mm" # Sandwich-HL
    fireRate: 10
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/atreides.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: StaticPrice # Mono
    price: 2000
  - type: ItemSlots
    slots:
       gun_magazine:
          name: Magazine
          startingItem: Magazine57x28mmSubMachineGunFMJ
          insertSound: /Audio/Weapons/Guns/MagIn/smg_magin.ogg
          ejectSound: /Audio/Weapons/Guns/MagOut/smg_magout.ogg
          priority: 2
          whitelist:
            tags:
              - Magazine57x28mmSubMachineGunFMJ
          whitelistFailPopup: gun-magazine-whitelist-fail
       gun_chamber:
          name: Chamber
          startingItem: Cartridge57x28mmFMJ
          priority: 1
          whitelist:
            tags:
              - Cartridge57x28mmFMJ
  - type: NFWeaponDetails # Sandwich-HL
    manufacturer: weapon-details-manufacturer-gorlex-steel-works # Sandwich-HL

