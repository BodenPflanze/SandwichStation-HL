- type: entity
  abstract: true
  id: BaseBluespaceCabinet
  parent: 
  - BaseStorageItem
  - BaseCabinetsStorage
  components:
  - type: Item
    size: Ginormous
  - type: Storage
    maxItemSize: Ginormous
  - type: ClothingSpeedModifier
    walkModifier: 0.4
    sprintModifier: 0.4
  - type: HeldSpeedModifier
  - type: MultiHandedItem
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Tag
    tags:
    - BluespaceStashCabinet

- type: entity
  id: BluespaceCabinetStandard
  parent: BaseBluespaceCabinet
  name: bluespace stash container
  description: A bluespace container for the bluespace stash to store your valuables.
  components:
  - type: Sprite
    sprite: _HL/Objects/Specific/bluespacecabinets/standart.rsi
    state: icon
    scale: 0.85, 0.85
  - type: Construction
    graph: CraftBluespaceCabinetStandard
    node: icon

