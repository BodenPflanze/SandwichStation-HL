- type: entity
  id: SpawnPointServiceQuadborg
  parent: SpawnPointJobBase
  name: service quadborg
  components:
  - type: SpawnPoint
    job_id: ServiceQuadBorg
  - type: Sprite
    layers:
    - sprite: Markers/jobs.rsi
      state: green
    - sprite: Floof/Mobs/Silicon/quad.rsi
      state: quadspriteserv
      scale: 0.7, 0.7
      map: ["movement"]
    - sprite: Floof/Mobs/Silicon/quad.rsi
      state: quadspriteservl
      scale: 0.7, 0.7
      map: ["enum.BorgVisualLayers.Light"]
      shader: unshaded
      visible: false
    - sprite: Floof/Mobs/Silicon/quad.rsi
      state: quadspriteservr
      scale: 0.7, 0.7
      shader: unshaded
      map: ["light"]
      visible: false

