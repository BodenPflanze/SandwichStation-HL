- type: entity
  id: Magazine556/762x39Improvised
  name: improvised rifle magazine (5.56x45/7.62x39)
  parent: [ BaseC1Contraband, RecyclableItemSteelTiny, BaseMagazineLightRifle ]
  components:
  - type: Tag
    tags:
      - ForgedRifleMagazine
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge762x39mmFMJ
        - Cartridge556x45mmFMJ
        - Cartridge556x45mmImprovised
    proto: Cartridge556x45mmFMJ
    capacity: 20
  - type: Sprite
    sprite: _Mono/Objects/Weapons/Guns/Ammunition/Magazine/762x39mm/762x39mm_mag.rsi # Todo: A sprite that looks more improvised
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

