# Empty mags
- type: entity
  parent: BaseMagazine9x19mmPistolHighCapacityFMJ
  id: MagazineAsmgtUniversalEmpty
  name: ASMGT-compatible box magazine
  description: |-
   Universal ASMGT-compatible ammo box capable of accepting .9x19, .45 ACP, 5.56x45 and 7.56x39 cartridges
  suffix: empty
  components:
  - type: Tag
    tags:
      - MagazineAsmgt
  - type: Item
    size: Small
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
        - Cartridge9x19mmFMJ
        - Cartridge45_ACPFMJ
        - Cartridge556x45mmFMJ
        - Cartridge762x39mmFMJ
    capacity: 50
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Ammunition/Magazine/Turret/box_mag.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 11
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: MagazineAsmgtUniversalEmpty
  id: MagazineAsmgtUniversalPistol
  name: ASMGT-compatible box magazine
  suffix: loaded 9x19mm
  components:
  - type: BallisticAmmoProvider
    proto: Cartridge9x19mmFMJ
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
