#region frame
- type: entity
  id: NFBaseWeaponFrameRevolver
  parent: [ NFBaseWeaponEncumbrancePistol, NFBaseItemWeaponGun ]
  abstract: true
  components:
  - type: Sprite
    layers:
    - state: icon
      map: ["enum.GunVisualLayers.Base"]
  - type: Gun
    projectileSpeed: 22.5
    minAngle: 3.7
    maxAngle: 11.1
    angleIncrease: 1.5
    angleDecay: 0.5
    fireRate: 3
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
  - type: UseDelayOnShoot
  - type: UseDelay
    delay: 0.66
  - type: StaticPrice
    price: 200
  - type: NFWeaponDetails
    class: weapon-details-class-revolver

#region manufacturer
- type: entity
  id: NFBaseWeaponFrameRevolverFrontierGunsmith
  parent: NFBaseWeaponFrameRevolver
  abstract: true
  components:
  - type: Gun
    angleIncrease: 1.5
    angleDecay: 0.5
    fireRate: 2.5
  - type: NFWeaponDetails
    manufacturer: weapon-details-manufacturer-frontier-gunsmith-consortium

#region chamber
- type: entity
  id: NFBaseWeaponRevolverChamber
  abstract: true
  components:
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/revolver.ogg
  - type: RevolverAmmoProvider
    mayTransfer: true
    capacity: 6
    chambers: [ True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null ]
    soundEject:
      path: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg
  - type: ContainerContainer
    containers:
      revolver-ammo: !type:Container

- type: entity
  id: NFBaseWeaponRevolverChamber9x19 # Sandwich-HL
  parent: NFBaseWeaponRevolverChamber
  abstract: true
  components:
  - type: Gun
    customCaliber: "9x19mm" # Sandwich-HL
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/mk58.ogg
  - type: RevolverAmmoProvider
    whitelist:
      tags:
        - Cartridge9x19mmFMJ # Sandwich-HL
        - SpeedLoader9x19mmFMJ # Sandwich-HL
    capacity: 8
    proto: Cartridge9x19mmFMJ
    chambers: [ True, True, True, True, True, True, True, True ]
    ammoSlots: [ null, null, null, null, null, null, null, null ]