- type: entity
  id: WeaponRifleSVS
  name: SVT-42
  parent: [ BaseWeaponRifle_RequiersWieldable, BaseGunMelee, BaseC1Contraband ]
  description: "Originally designed by SESWC, this old surplus rifle looks like it's seen a few wars. Uses low capacity 10 rounder 7.62x54mmR magazines. Equipped with bayonet."  #Hardlight
  components:
  - type: Sprite
    sprite: _NF/Objects/Weapons/Guns/Rifles/svs42.rsi
    layers:
      - state: mag-0
        map: ["enum.GunVisualLayers.Mag"]
      - state: base
        map: ["enum.GunVisualLayers.Base"]
  - type: Clothing
    sprite: _NF/Objects/Weapons/Guns/Rifles/svs42.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: Gun
    customCaliber: "7.62x54mmR" # Sandwich-HL
    fireRate: 5  # highly underpower so buff  Hardlight
    selectedMode: SemiAuto
    availableModes:
      - SemiAuto
      - FullAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/rifle2.ogg
  - type: ChamberMagazineAmmoProvider
    soundRack:
      path: /Audio/Weapons/Guns/Cock/ltrifle_cock.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine762x54mmRFMJ
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine762x54mmRFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge762x54mmRFMJ
        priority: 1
        whitelist:
          tags:
            - Cartridge762x54mmRFMJ
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 1.5
    pvsIncrease: 0.15
  - type: AltFireMelee
    attackType: Light
  - type: NFWeaponDetails  # Hardlight change
    manufacturer: weapon-details-manufacturer-SESWC-consortium
