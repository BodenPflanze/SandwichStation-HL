#region WizDen
- type: entity
  parent: WeaponRifleLecter
  id: WeaponRifleLecterRubber
  suffix: Less-lethal # Sandwich-HL: Non-lethal < Less-Lethal (rubber still hurts)
  components:
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: Magazine556x45mmRubber
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
            - Magazine556x45mmFMJ
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: Cartridge556x45mmRubber
        priority: 1
        whitelist:
          tags:
            - Cartridge556x45mmFMJ

