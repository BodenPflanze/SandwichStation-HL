    belt: ClothingBeltSecurityFilled
    pocket2: FlashlightSeclite
  storage:
    back:
    - WeaponDisabler
    - MedicatedSuture
    - RegenerativeMesh
    - BoxZiptie
    - CrowbarRed
    - Magazine45_magnumPistolFMJ

- type: startingGear
  id: ERTLeaderGearEVALecter
